name: Omega DNA End-to-End Release
summary: Centralized stamp → evidence bind → fail-closed gate.
description: Inherits Ω DNA and releases only when caller-supplied evidence is PASS and binds to the exact artifact SHA-256.
inputs:
  artifact:
    required: true
    description: Artifact path in caller workspace
  artifact-id:
    required: true
    description: Stable artifact ID
  parent-id:
    required: true
    description: Parent contract/artifact ID
  profiles:
    required: false
    default: ''
    description: Comma-separated applicable profiles
  evidence-file:
    required: true
    description: JSON evidence file generated by caller's real validators
runs:
  using: composite
  steps:
    - name: Stamp UNPROVEN lineage
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../inherit/stamp.mjs" "${{ inputs.artifact }}" "${{ inputs.artifact-id }}" "${{ inputs.parent-id }}" "${{ inputs.profiles }}"
    - name: Bind independent product evidence
      shell: bash
      run: node "$GITHUB_ACTION_PATH/merge-evidence.mjs" "${{ inputs.artifact }}" "${{ inputs.artifact }}.omega.json" "${{ inputs.evidence-file }}"
    - name: Fail-closed release gate
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../gate/verify.mjs" "${{ inputs.artifact }}" "${{ inputs.artifact }}.omega.json"
