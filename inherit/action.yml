name: Omega DNA Inherit
summary: Stamp an artifact with Ω lineage; never upgrades it to PASS.
description: Creates <artifact>.omega.json bound to the central Ω genome and artifact SHA-256. The resulting sidecar starts UNPROVEN.
inputs:
  artifact:
    description: Path to artifact in caller workspace
    required: true
  artifact-id:
    description: Stable artifact identifier
    required: true
  parent-id:
    description: Parent contract/artifact identifier
    required: true
  profiles:
    description: Comma-separated applicable profiles
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/stamp.mjs" "${{ inputs.artifact }}" "${{ inputs.artifact-id }}" "${{ inputs.parent-id }}" "${{ inputs.profiles }}"
