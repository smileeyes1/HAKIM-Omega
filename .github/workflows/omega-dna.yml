name: Omega DNA Fail-Closed Gate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  dna-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Omega DNA and all lineage sidecars
        run: node runtime/validate-dna.mjs
      - name: Verify Google / Apps Script / Gemini adapter inheritance
        run: node runtime/validate-google-adapter.mjs
      - name: Execute Google Project Bootstrap runtime qualification
        run: node runtime/test-google-project-bootstrap.mjs
      - name: Verify platform propagation registry
        run: node runtime/validate-platform-registry.mjs
      - name: Verify bounded production reference systems
        run: node runtime/validate-reference-systems.mjs
      - name: Verify stable autorecover current pointer and fallback
        run: node runtime/validate-recovery-current.mjs
      - name: Execute bounded production router qualification
        run: node runtime/test-production-router.mjs
      - name: Syntax-check centralized release binder
        run: node --check release/merge-evidence.mjs
      - name: Build release-action positive fixture and evidence
        shell: bash
        run: |
          mkdir -p .omega-fixture
          printf 'omega-fixture-v1\n' > .omega-fixture/product.bin
          HASH=$(sha256sum .omega-fixture/product.bin | awk '{print $1}')
          cat > .omega-fixture/evidence.json <<EOF
          {"result":"PASS","tested_artifact_sha256":"$HASH","evidence_ids":["FIXTURE_VALIDATOR_PASS"],"scope":"HOST_ONLY","claims":[],"limitations":["TEST_FIXTURE_ONLY"]}
          EOF
      - name: Execute centralized Omega release action end-to-end
        uses: ./release
        with:
          artifact: .omega-fixture/product.bin
          artifact-id: CI_RELEASE_FIXTURE_V1
          parent-id: OMEGA_DNA_CI_CONTRACT
          profiles: host_assurance
          evidence-file: .omega-fixture/evidence.json
      - name: Verify tamper is killed after release
        shell: bash
        run: |
          printf 'tamper\n' >> .omega-fixture/product.bin
          if node gate/verify.mjs .omega-fixture/product.bin .omega-fixture/product.bin.omega.json; then
            echo 'ERROR: tampered artifact escaped fail-closed gate'
            exit 1
          fi
          echo 'OMEGA_TAMPER_NEGATIVE_TEST_PASS'
