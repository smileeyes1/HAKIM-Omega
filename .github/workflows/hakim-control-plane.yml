name: HAKIM Control Plane Gate

on:
  push:
    paths:
      - 'hakim/**'
      - 'platforms/platform-registry.json'
      - 'mobile-agent/hakim-omega-local-bridge.user.js'
      - 'runtime/hakim-control-plane.mjs'
      - 'runtime/test-hakim-control-plane.mjs'
      - 'runtime/test-browser-bridge.mjs'
      - 'runtime/ingest-browser-bridge-report.mjs'
      - 'runtime/test-field-bridge-ingest.mjs'
      - 'runtime/validate-platform-registry.mjs'
      - 'runtime/validate-phone-control-layer.mjs'
      - 'runtime/test-phone-control-layer.mjs'
      - 'runtime/hakim-self-evolution.mjs'
      - 'runtime/test-hakim-self-evolution.mjs'
      - 'runtime/validate-governance-integrity.mjs'
      - 'runtime/test-governance-integrity.mjs'
      - 'runtime/validate-canonical-instance.mjs'
      - 'runtime/test-canonical-instance.mjs'
      - '.github/workflows/hakim-control-plane.yml'
      - '.github/workflows/hakim-field-bridge-ingest.yml'
  pull_request:
    paths:
      - 'hakim/**'
      - 'platforms/platform-registry.json'
      - 'mobile-agent/hakim-omega-local-bridge.user.js'
      - 'runtime/hakim-control-plane.mjs'
      - 'runtime/test-hakim-control-plane.mjs'
      - 'runtime/test-browser-bridge.mjs'
      - 'runtime/ingest-browser-bridge-report.mjs'
      - 'runtime/test-field-bridge-ingest.mjs'
      - 'runtime/validate-platform-registry.mjs'
      - 'runtime/validate-phone-control-layer.mjs'
      - 'runtime/test-phone-control-layer.mjs'
      - 'runtime/hakim-self-evolution.mjs'
      - 'runtime/test-hakim-self-evolution.mjs'
      - 'runtime/validate-governance-integrity.mjs'
      - 'runtime/test-governance-integrity.mjs'
      - 'runtime/validate-canonical-instance.mjs'
      - 'runtime/test-canonical-instance.mjs'
      - '.github/workflows/hakim-control-plane.yml'
      - '.github/workflows/hakim-field-bridge-ingest.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate control plane
        run: node runtime/hakim-control-plane.mjs validate
      - name: Run fail-closed control-plane regression tests
        run: node runtime/test-hakim-control-plane.mjs
      - name: Validate platform propagation boundaries
        run: node runtime/validate-platform-registry.mjs
      - name: Run local-browser bridge security tests
        run: node runtime/test-browser-bridge.mjs
      - name: Test field-bridge evidence ingestion
        run: node runtime/test-field-bridge-ingest.mjs
      - name: Validate phone control layer
        run: node runtime/validate-phone-control-layer.mjs
      - name: Run phone control fail-closed regression tests
        run: node runtime/test-phone-control-layer.mjs
      - name: Validate continuous self-evolution policy and learning ledger
        run: node runtime/hakim-self-evolution.mjs validate
      - name: Run adversarial self-evolution promotion tests
        run: node runtime/test-hakim-self-evolution.mjs
      - name: Validate cross-layer governance integrity
        run: node runtime/validate-governance-integrity.mjs
      - name: Run adversarial governance-integrity mutation tests
        run: node runtime/test-governance-integrity.mjs
      - name: Validate sole canonical original Hakim identity
        run: node runtime/validate-canonical-instance.mjs
      - name: Run adversarial canonical-instance mutation tests
        run: node runtime/test-canonical-instance.mjs
