name: HAKIM Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-hakim/**'
      - 'hakim/HAKIM_ANDROID_MISSION.json'
      - '.github/workflows/hakim-android-apk.yml'
  pull_request:
    paths:
      - 'android-hakim/**'
      - 'hakim/HAKIM_ANDROID_MISSION.json'
      - '.github/workflows/hakim-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: android-hakim
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android-hakim
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s android-hakim/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hakim-android-debug-apk
          path: android-hakim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
